version: 2

# Every mart has an enforced contract and a data_type on every column. Only not_null is enforced by Trino/Iceberg;
# primary_key and unique are declared as metadata (adapter: not supported, hence warn_unsupported: false) and are
# backed by the generic tests below (ADR-0028).
models:
  - name: dim_customer
    description: "SCD2 customer dimension built from the bronze change log. Grain: one row per (customer, version). Holds PII (all versions)."
    config:
      contract: {enforced: true}
    columns:
      - name: customer_sk
        data_type: varchar
        description: "xxhash64 of customer_id and valid_from_lsn."
        constraints: [{type: not_null}, {type: primary_key, warn_unsupported: false}]
        data_tests: [unique, not_null]
      - name: customer_id
        data_type: bigint
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - {name: full_name, data_type: varchar}
      - {name: email, data_type: varchar}
      - {name: phone, data_type: varchar}
      - {name: address, data_type: varchar}
      - {name: date_of_birth, data_type: date}
      - {name: created_at, data_type: "timestamp(6) with time zone"}
      - {name: valid_from, data_type: "timestamp(6) with time zone", constraints: [{type: not_null}]}
      - {name: valid_to, data_type: "timestamp(6) with time zone", description: "NULL while current."}
      - name: valid_from_lsn
        data_type: bigint
        description: "Authoritative interval start: [valid_from_lsn, valid_to_lsn)."
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - {name: valid_to_lsn, data_type: bigint}
      - {name: txid, data_type: bigint}
      - {name: is_current, data_type: boolean, constraints: [{type: not_null}]}
      - {name: closed_by_delete, data_type: boolean, constraints: [{type: not_null}]}
      - {name: src_kafka_ts, data_type: "timestamp(6) with time zone", description: "Incremental cursor: newest bronze arrival in the version.", constraints: [{type: not_null}]}

  - name: dim_merchant
    description: "SCD2 merchant dimension built from the bronze change log. Grain: one row per (merchant, version). No customer data."
    config:
      contract: {enforced: true}
    columns:
      - name: merchant_sk
        data_type: varchar
        constraints: [{type: not_null}, {type: primary_key, warn_unsupported: false}]
        data_tests: [unique, not_null]
      - name: merchant_id
        data_type: bigint
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - {name: name, data_type: varchar}
      - {name: category, data_type: varchar}
      - {name: country, data_type: varchar}
      - {name: created_at, data_type: "timestamp(6) with time zone"}
      - {name: valid_from, data_type: "timestamp(6) with time zone", constraints: [{type: not_null}]}
      - {name: valid_to, data_type: "timestamp(6) with time zone"}
      - name: valid_from_lsn
        data_type: bigint
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - {name: valid_to_lsn, data_type: bigint}
      - {name: txid, data_type: bigint}
      - {name: is_current, data_type: boolean, constraints: [{type: not_null}]}
      - {name: closed_by_delete, data_type: boolean, constraints: [{type: not_null}]}
      - {name: src_kafka_ts, data_type: "timestamp(6) with time zone", constraints: [{type: not_null}]}

  - name: dim_date
    description: "Calendar dimension. Grain: one row per day."
    config:
      contract: {enforced: true}
    columns:
      - name: date_key
        data_type: integer
        description: "yyyymmdd."
        constraints: [{type: not_null}, {type: primary_key, warn_unsupported: false}]
        data_tests: [unique, not_null]
      - {name: calendar_date, data_type: date, constraints: [{type: not_null}]}
      - {name: year, data_type: integer}
      - {name: month, data_type: integer}
      - {name: day, data_type: integer}
      - {name: iso_week, data_type: integer}
      - {name: day_of_week, data_type: integer}

  - name: dim_account
    description: "Type-1 account dimension from silver. Grain: one row per account. Holds customer_id (re-keyed via silver on forget)."
    config:
      contract: {enforced: true}
    columns:
      - name: account_id
        data_type: bigint
        constraints: [{type: not_null}, {type: primary_key, warn_unsupported: false}]
        data_tests: [unique, not_null]
      - name: owner_type
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments: {values: [customer, merchant]}
      - {name: customer_id, data_type: bigint}
      - {name: merchant_id, data_type: bigint}
      - {name: currency, data_type: varchar}

  - name: fct_transactions
    description: "Grain: one row per transaction id (refund folded in). description is excluded (data minimization)."
    config:
      contract: {enforced: true}
    columns:
      - name: transaction_id
        data_type: bigint
        constraints: [{type: not_null}, {type: primary_key, warn_unsupported: false}]
        data_tests: [unique, not_null]
      - name: txn_type
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments: {values: [payment, topup]}
      - {name: customer_id, data_type: bigint, constraints: [{type: not_null}]}
      - name: customer_sk
        data_type: varchar
        description: "dim_customer version in force at first_lsn (point-in-time join by change LSN)."
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_customer')", field: customer_sk}
      - {name: merchant_id, data_type: bigint}
      - name: merchant_sk
        data_type: varchar
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_merchant')", field: merchant_sk}
      - {name: payer_account_id, data_type: bigint}
      - {name: payee_account_id, data_type: bigint, constraints: [{type: not_null}]}
      - {name: amount, data_type: "decimal(12,2)", constraints: [{type: not_null}]}
      - {name: currency, data_type: varchar}
      - {name: status, data_type: varchar}
      - {name: created_at, data_type: "timestamp(6) with time zone"}
      - {name: business_date, data_type: date}
      - name: date_key
        data_type: integer
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_date')", field: date_key}
      - {name: refund_id, data_type: bigint}
      - {name: refunded_amount, data_type: "decimal(12,2)"}
      - {name: first_lsn, data_type: bigint, description: "LSN of the transaction's first change seen by gold; carried forward across re-keys."}
      - {name: src_lsn, data_type: bigint}
      - {name: src_source_ts, data_type: "timestamp(6) with time zone", description: "Incremental cursor."}

  - name: fct_ledger_entries
    description: "Grain: one row per (journal, leg). Double-entry, signed, append-only by construction. No customer_id."
    config:
      contract: {enforced: true}
    columns:
      - name: entry_id
        data_type: varchar
        description: "journal_type:source_id:leg"
        constraints: [{type: not_null}, {type: primary_key, warn_unsupported: false}]
        data_tests: [unique, not_null]
      - name: journal_id
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: journal_type
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values:
              arguments: {values: [opening, topup, payment, refund]}
      - {name: transaction_id, data_type: bigint, description: "NULL for opening journals."}
      - {name: refund_id, data_type: bigint}
      - name: account_id
        data_type: bigint
        description: "Negative ids are external contra accounts: -1 funding, -2 opening equity."
        constraints: [{type: not_null}]
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_account')", field: account_id}
              config: {where: "account_id > 0"}
      - {name: amount, data_type: "decimal(14,2)", constraints: [{type: not_null}]}
      - {name: currency, data_type: varchar}
      - {name: business_date, data_type: date, constraints: [{type: not_null}]}
      - {name: date_key, data_type: integer}
      - {name: source_lsn, data_type: bigint}
      - {name: src_source_ts, data_type: "timestamp(6) with time zone", description: "Incremental cursor."}
