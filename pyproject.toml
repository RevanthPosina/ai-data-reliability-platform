[project]
name = "adrp"
version = "0.0.0"
description = "AI Data Reliability Platform: CDC -> Iceberg -> vector index + versioned training datasets"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py310"  # the Spark image runs Python 3.10
extend-exclude = ["dbt_fixture/target", "dbt_fixture/dbt_packages", ".run", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/g3_check.py" = ["E501"]
"scripts/g6_check.py" = ["E501"]  # long human-readable check descriptions
"scripts/g8_check.py" = ["E501"]

[tool.mypy]
python_version = "3.10"  # code that runs in the Spark image must be 3.10-safe
files = ["src", "scripts", "tests"]
mypy_path = ["src", "scripts"]
explicit_package_bases = true
strict = true
ignore_missing_imports = true
# Heavy runtime deps (pyspark, torch, qdrant, dagster) live only in the images.
disallow_untyped_decorators = false
disallow_any_unimported = false
warn_return_any = false

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
# tests/spark needs a JVM and runs in the Spark image (make test-spark)
addopts = "--ignore=tests/spark"
